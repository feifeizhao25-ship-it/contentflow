name: Release Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable image tag (release version or commit SHA; latest is rejected)
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/contentflow

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./runtime/api
            dockerfile: ./runtime/api/Dockerfile
          - name: web-cn
            context: ./runtime/web-cn
            dockerfile: ./runtime/web-cn/Dockerfile
          - name: web-int
            context: ./runtime/web-int
            dockerfile: ./runtime/web-int/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Validate immutable image tag
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          case "$IMAGE_TAG" in
            latest|*[!A-Za-z0-9._-]*|'')
              echo "Use an immutable release version or commit SHA, not '$IMAGE_TAG'." >&2
              exit 1
              ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ inputs.tag }}
