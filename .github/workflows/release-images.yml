name: Release Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable image tag (release version or commit SHA; latest is rejected)
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/contentflow

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./runtime/api
            dockerfile: ./runtime/api/Dockerfile
          - name: web-cn
            context: ./runtime/web-cn
            dockerfile: ./runtime/web-cn/Dockerfile
          - name: web-int
            context: ./runtime/web-int
            dockerfile: ./runtime/web-int/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Validate immutable image tag
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          case "$IMAGE_TAG" in
            latest|*[!A-Za-z0-9._-]*|'')
              echo "Use an immutable release version or commit SHA, not '$IMAGE_TAG'." >&2
              exit 1
              ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - name: Validate domestic public backend configuration
        if: matrix.name == 'web-cn'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.CN_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CN_SUPABASE_ANON_KEY }}
        run: |
          node -e 'const u = new URL(process.env.NEXT_PUBLIC_SUPABASE_URL); if (u.protocol !== "https:" || u.hostname.endsWith(".invalid") || !process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY) throw new Error("请配置国内公开后端地址和匿名公钥；禁止使用构建占位值")'
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ matrix.name == 'web-cn' && vars.CN_SUPABASE_URL || '' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ matrix.name == 'web-cn' && secrets.CN_SUPABASE_ANON_KEY || '' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ inputs.tag }}
