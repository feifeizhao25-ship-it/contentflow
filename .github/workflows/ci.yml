name: CI

on:
  push:
    branches: [main, codex/production-readiness-20260729]
  pull_request:
    branches: [main]

concurrency:
  group: contentflow-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runtime/api/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  web:
    strategy:
      fail-fast: false
      matrix:
        app: [web-cn, web-int]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          API_INTERNAL_URL: http://127.0.0.1:4000
      - run: npm audit --omit=dev --audit-level=high

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp runtime/.env.production.example runtime/.env.production
      - run: docker compose --env-file runtime/.env.production -f runtime/docker-compose.production.yml config --quiet
      - run: python3 scripts/verify_language_contracts.py
