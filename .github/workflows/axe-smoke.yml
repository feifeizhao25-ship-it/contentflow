name: Axe smoke

# Serious and critical axe-core findings on the key public and workspace shells.
# Not a WCAG certification. The browser has no real account, and requests off
# this machine are aborted.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

concurrency:
  group: axe-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: Key routes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            runtime/web-cn/package-lock.json
            runtime/web-int/package-lock.json
            e2e/axe/package-lock.json

      - name: Install web dependencies
        run: |
          npm ci --prefix runtime/web-cn
          npm ci --prefix runtime/web-int
          npm ci --prefix e2e/axe

      - name: Build both apps
        env:
          SILICONFLOW_API_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://contentflow-ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key
        run: |
          npm run build --prefix runtime/web-cn
          npm run build --prefix runtime/web-int

      - name: Install Chromium
        working-directory: e2e/axe
        run: npx playwright install --with-deps chromium

      - name: Start both apps
        run: |
          npm run start --prefix runtime/web-cn -- -H 127.0.0.1 -p 3101 > /tmp/web-cn.log 2>&1 &
          npm run start --prefix runtime/web-int -- -H 127.0.0.1 -p 3102 > /tmp/web-int.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3101/login && curl -sf -o /dev/null http://127.0.0.1:3102/login; then
              exit 0
            fi
            sleep 2
          done
          echo 'web-cn log:' && cat /tmp/web-cn.log
          echo 'web-int log:' && cat /tmp/web-int.log
          exit 1

      - name: Run axe smoke
        working-directory: e2e/axe
        env:
          CN_BASE: http://127.0.0.1:3101
          INT_BASE: http://127.0.0.1:3102
        run: npx playwright test
