name: contentflow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contentflow
      POSTGRES_USER: contentflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentflow -d contentflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks: [backend]

  api:
    build: ./api
    image: contentflow-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://contentflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/contentflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_FAST: ${OPENROUTER_MODEL_FAST:-qwen/qwen3-30b-a3b-instruct-2507}
      OPENROUTER_MODEL_QUALITY: ${OPENROUTER_MODEL_QUALITY:-deepseek/deepseek-v3.2}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-deepseek/deepseek-v3.2,google/gemini-2.5-flash-lite}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://fenfa.ai}
      OPENROUTER_CIRCUIT_FAILURES: ${OPENROUTER_CIRCUIT_FAILURES:-3}
      OPENROUTER_CIRCUIT_COOLDOWN_MS: ${OPENROUTER_CIRCUIT_COOLDOWN_MS:-60000}
      AI_TENANT_DAILY_BUDGET_USD: ${AI_TENANT_DAILY_BUDGET_USD:-20}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:?PAYMENT_CALLBACK_SECRET is required}
      FAL_API_KEY: ${FAL_API_KEY:-}
      BANK_TRANSFER_ACCOUNT_NAME: ${BANK_TRANSFER_ACCOUNT_NAME:-}
      BANK_TRANSFER_ACCOUNT_NO: ${BANK_TRANSFER_ACCOUNT_NO:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  web-cn:
    build: ./web-cn
    image: contentflow-web-cn:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL_FAST:-qwen/qwen3-30b-a3b-instruct-2507}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-deepseek/deepseek-v3.2,google/gemini-2.5-flash-lite}
    expose: ["3000"]
    depends_on:
      api: { condition: service_healthy }
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.next/cache:size=128m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  web-int:
    build: ./web-int
    image: contentflow-web-int:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    expose: ["3000"]
    depends_on:
      api: { condition: service_healthy }
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.next/cache:size=128m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CN_DOMAIN: ${CN_DOMAIN:?CN_DOMAIN is required}
      INT_DOMAIN: ${INT_DOMAIN:?INT_DOMAIN is required}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web-cn: { condition: service_healthy }
      web-int: { condition: service_healthy }
    networks: [backend]
    security_opt: [no-new-privileges:true]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
