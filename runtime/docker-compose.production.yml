name: contentflow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contentflow
      POSTGRES_USER: contentflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentflow -d contentflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks: [backend]

  api:
    build: ./api
    image: ${CONTENTFLOW_IMAGE_PREFIX:-contentflow}-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://contentflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/contentflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_KEY_BACKUP: ${OPENROUTER_API_KEY_BACKUP:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-x-ai/grok-4.5}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      FAL_API_KEY: ${FAL_API_KEY:-}
      FAL_API_KEY_BACKUP: ${FAL_API_KEY_BACKUP:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [backend]

  web-cn:
    build: ./web-cn
    image: ${CONTENTFLOW_IMAGE_PREFIX:-contentflow}-web-cn:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "${CN_WEB_PORT:-3100}:3000"
    depends_on:
      api: { condition: service_healthy }
    networks: [backend]

  web-int:
    build: ./web-int
    image: ${CONTENTFLOW_IMAGE_PREFIX:-contentflow}-web-int:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "${INT_WEB_PORT:-3200}:3000"
    depends_on:
      api: { condition: service_healthy }
    networks: [backend]

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
