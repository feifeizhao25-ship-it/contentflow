workflows:
  contentflow-ios:
    name: ContentFlow iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter doctor
        script: flutter doctor -v
      - name: Get packages
        script: flutter packages pub get
      - name: Build iOS (no-codesign smoke)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/**/*.app
  contentflow-ios-release:
    name: ContentFlow iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      vars:
        CM_CERTIFICATE_B64: 
        CM_CERTIFICATE_PW: Aurenix2026!
        CM_PROFILE_B64: 
    scripts:
      - name: Get packages
        script: flutter packages pub get
      - name: Install signing files (manual)
        script: |
          set -e
          echo "$CM_CERTIFICATE_B64" | base64 --decode > /tmp/certificate.p12
          echo "$CM_PROFILE_B64" | base64 --decode > /tmp/profile.mobileprovision
          security create-keychain -p "$CM_CERTIFICATE_PW" sign.keychain
          security import /tmp/certificate.p12 -k sign.keychain -P "$CM_CERTIFICATE_PW" -A
          security unlock-keychain -p "$CM_CERTIFICATE_PW" sign.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$CM_CERTIFICATE_PW" sign.keychain
          security list-keychains -s sign.keychain
          security default-keychain -d user -s sign.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Apply manual signing to Xcode project
        script: xcode-project use-profiles
      - name: Build IPA (signed, app_store)
        script: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      # --- Bank IPA to Vultr artifacts store ---
      - name: Bank IPA to Vultr
        script: |
          echo "" | base64 -d > /tmp/vk && chmod 600 /tmp/vk
          mkdir -p ~/.ssh && echo "StrictHostKeyChecking no" > ~/.ssh/config
          (scp -i /tmp/vk build/ios/ipa/*.ipa ubuntu@54.218.239.203:/opt/artifacts/cf/ || echo "WARN: bank scp failed, continuing") && rm -f /tmp/vk
          echo "IPA banked to Vultr /opt/artifacts/cf/"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: |
